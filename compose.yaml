networks:
  hadoop-net:
    driver: bridge

services:
  hdsphere-master:
    image: hdsphere-master-official
    container_name: hdsphere-master
    hostname: quochuy026-master
    volumes:
      - hdfs_namenode:/home/hadoopquochuy026/hadoop/hadoop_data/hdfs/namenode
      - hive_metastore:/home/hadoopquochuy026/hive/data
      - hive_warehouse:/home/hadoopquochuy026/hive/warehouse
      - zookeeper_data:/home/hadoopquochuy026/zookeeper/data
      - ./scripts:/home/hadoopquochuy026/scripts
      - ./data:/home/hadoopquochuy026/data

    ports:
      - "60070:50070"
      - "9004:9004"
      - "9870:9870"
      - "16010:16010"
      - "8042:8042"
      - "8088:8088"
      - "8080:8080"
      - "7070:7070"
      - "4040:4040"
    networks:
      - hadoop-net
    command: /bin/bash -c "service ssh start; tail -f /dev/null"
    
volumes:
  hdfs_namenode:
  hive_metastore:
  hive_warehouse:
  zookeeper_data: